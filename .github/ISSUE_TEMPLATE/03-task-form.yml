name: 🛠️ Task
description: Track internal Selfcoder maintenance, documentation, or implementation work.
type: "Task"
projects: ["coderoomstudio/9"]
body:
  - type: textarea
    id: task-goal
    attributes:
      label: Goal
      description: Briefly describe the goal of this task
      placeholder: |
        e.g. Update the context attachments documentation after changing how pinned files are included in Selfcoder requests.
    validations:
      required: true
  - type: textarea
    id: task-description
    attributes:
      label: Description
      description: List the specific points or steps to accomplish
      placeholder: |
        e.g.
        - Update the docs page that explains pinned files and image attachments.
        - Check the README links still point to the right guide.
        - Verify the issue mentions any LM Studio, Ollama, or VS Code version constraints.
    validations:
      required: false
